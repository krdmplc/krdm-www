[build]
  publish = "public"
  command = "npm run lint && chmod +x ./bin/build.sh && ./bin/build.sh"

[build.environment]
  # Keep equal to HUGO_VERSION in .github/workflows/deploy.yml (Cloudflare builds).
  HUGO_VERSION = "0.169.0"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"

[dev]
  framework = "hugo"

# Response headers are in static/_headers, which Cloudflare reads too.
