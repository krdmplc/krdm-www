# Where the towns from event venues ("Venue, Town") are, for the maps on the stats
# page (/statistika/). A town that isn't listed here is left off the maps, and the
# build warns about it: add it with its latitude and longitude (e.g. from
# openstreetmap.org — the town centre, not the municipality's) and, outside
# Slovenia, its country (ISO code; SI if left out). Town names are written as the
# events write them (the local name: Wien, Praha).
#
# `maps` are the areas the two maps show: Slovenian towns go on `slovenia`, towns
# abroad on `europe` (with Slovenia filled in); a town outside both is listed under
# the maps. assets/maps/<name>.svg was drawn for exactly these bounds
# (equirectangular, Natural Earth via world-atlas 2.0.2), so they can't change
# without redrawing it.
maps:
  slovenia: {west: 13.3, east: 16.7, south: 45.35, north: 46.95}
  europe: {west: 5.5, east: 21, south: 42.8, north: 52.2}

