llmsIntro = "Društvo KRDM is a non-profit association from Kranj, Slovenia, founded in November 2016. It promotes independent music and art in the Gorenjska region: it organises the Distoržn concert series (metal), Plesen club nights (techno) and Plc Fest, publishes music by local artists, and runs the Plc rehearsal space in Planina, Kranj."
