name: Daily rebuild

# Events move from "upcoming" to "past" only when the site is rebuilt (the
# templates compare startDate with the build time), so rebuild and redeploy
# production every morning by dispatching the deploy workflow on main.

on:
  schedule:
    - cron: '17 3 * * *' # 04:17 CET / 05:17 CEST; off the hour, when GitHub's queue is busiest
  workflow_dispatch:

permissions:
  actions: write # to dispatch deploy.yml

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the production deploy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy.yml --ref main
