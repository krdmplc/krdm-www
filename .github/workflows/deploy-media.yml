name: Deploy the media Worker

# Deploys workers/media (the read-only Worker in front of the R2 bucket `krdm-media`,
# at https://media.krdm.si) when it changes on main. Branches don't get a preview:
# the Worker only reads, and every build of the site depends on it.

on:
  push:
    branches: [main]
    paths: ['workers/media/**', '.github/workflows/deploy-media.yml']
  workflow_dispatch:

concurrency:
  group: deploy-media
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_VERSION: '4.166.0' # keep equal to deploy.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN repository secret is not set"
            exit 1
          fi
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy -c workers/media/wrangler.jsonc
