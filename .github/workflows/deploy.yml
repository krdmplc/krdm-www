name: Deploy to Cloudflare

# Builds the site with Hugo and deploys it to the Worker `krdm-www` in the KRDM
# Cloudflare account (wrangler.jsonc): main to https://krdm-www.krdm.workers.dev,
# every other branch to https://<branch>-krdm-www.krdm.workers.dev.
#
# Netlify still serves www.krdm.si until krdm.si's DNS moves to Cloudflare, so for
# now every build here is a preview (noindex, robots.txt disallows all). At the
# cutover, main builds with CONTEXT=production and URL=https://www.krdm.si/, and
# daily-rebuild.yml dispatches this workflow instead of pinging Netlify.

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUGO_VERSION: '0.169.0' # keep equal to netlify.toml
  WRANGLER_VERSION: '4.166.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # HUGO_ENABLEGITINFO reads each page's last commit

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Install Hugo
        run: |
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Resized images; without this cache every build processes them all again.
      - uses: actions/cache@v4
        with:
          path: resources
          key: hugo-resources-${{ hashFiles('static/media/**', 'assets/**', 'hugo.toml') }}
          restore-keys: hugo-resources-

      - name: Work out the address
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            echo "url=https://krdm-www.krdm.workers.dev/" >> "$GITHUB_OUTPUT"
          else
            # Preview aliases: lowercase letters, digits and dashes.
            alias=$(printf %s "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-40 | sed -E 's/-+$//')
            echo "alias=$alias" >> "$GITHUB_OUTPUT"
            echo "url=https://$alias-krdm-www.krdm.workers.dev/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          CONTEXT: deploy-preview # main becomes "production" at the cutover
          DEPLOY_PRIME_URL: ${{ steps.target.outputs.url }}
          HEAD: ${{ github.ref_name }}
          HUGO_ENV: production
          HUGO_ENABLEGITINFO: 'true'
        run: ./bin/build.sh && sh ./bin/workers-redirects.sh

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALIAS: ${{ steps.target.outputs.alias }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN repository secret is not set"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" = main ]; then
            npx --yes "wrangler@${WRANGLER_VERSION}" deploy
          else
            npx --yes "wrangler@${WRANGLER_VERSION}" versions upload --preview-alias "$ALIAS"
          fi
