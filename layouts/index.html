{{ define "main" }}
  {{ partial "hero" .Params.hero }}
  <main>
    <div class="container">
      {{ partial "home/events" . }}
      {{ partial "home/releases" . }}
      {{ partial "home/artists" . }}

      <section>
        <h2 class="text-center">{{ .Params.about.title }}</h2>
        <div class="grid">
          <div class="col-12">
            {{ .Content }}
          </div>

          {{ with .Params.about.link }}
            <div class="col-12 text-center">
              <a href="{{ .href }}" class="button">{{ .text }}</a>
            </div>
          {{ end }}
        </div>
      </section>
    </div>
  </main>
{{ end }}
