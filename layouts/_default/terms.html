{{ define "main" }}
<main>
  <div class="container">
    {{ partial "breadcrumbs" . }}
    <h1>{{ .Title }} (terms)</h1>
    {{ .Content }}

    <div class="grid">
      {{ range sort .Pages "Title" }}
        <div class="col-12 col-md-6">
          {{ partial "card" . }}
        </div>
      {{ end }}
    </div>
  </div>
</main>
{{ end }}
