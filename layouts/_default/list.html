{{ define "main" }}
  <main>
    <div class="container">
      {{ partial "breadcrumbs" . }}
      <h1>{{ .Title }}</h1>
      {{ .Content }}

      <div class="grid">
        {{ range sort .Pages "Title" }}
          {{ partial "card" . }}
        {{ end }}
      </div>
    </div>
  </main>
{{ end }}
