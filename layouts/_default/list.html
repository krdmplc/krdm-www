{{ define "main" }}
  <main>
    <div class="container">
      {{ partial "breadcrumbs" . }}
      <h1>{{ .Title }}</h1>
      {{ .Content }}

      <div class="grid">
        {{ range sort .Pages "Date" "desc" }}
          <div class="col-12 col-md-6">
            {{ partial "card" . }}
          </div>
        {{ end }}
      </div>
      <br><br>
    </div>
  </main>
{{ end }}
