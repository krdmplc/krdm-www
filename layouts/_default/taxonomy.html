{{- /* List of all artists (taxonomy page). */ -}}
{{ define "main" }}
  <div class="container">
    {{ partial "breadcrumbs" . }}
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div class="content">{{ . }}</div>{{ end }}

    {{ partial "card-grid" (dict "pages" (partial "func/artists-by-activity" (dict "pages" .Pages)) "level" 2 "cols" 4) }}
  </div>
{{ end }}
