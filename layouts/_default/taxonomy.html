{{ define "main" }}
<main>
  <div class="wrapper">
    {{ partial "breadcrumbs" . }}

    <div class="grid">
      <div class="col-12 col-lg-10 offset-lg-1">
        <h1>{{ .Title }} (taxonomy template)</h1>

        {{ with .Params.thumbnail }}
          <div><img src="{{ . }}?nf_resize=fit&w=720" alt=""></div>
        {{ end }}

        {{ .Content }}
      </div>
    </div>
  </div>
</main>
{{ end }}
