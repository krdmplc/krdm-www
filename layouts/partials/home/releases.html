{{ with ($.Site.GetPage (printf "/%s" "releases")) }}
  <h2 class="text-center">{{ $.Params.releases.title }}</h2>

  <div class="grid">
    {{ range first 4 .Pages }}
      <div class="col-12 col-sm-6">
        {{ partial "card" . }}
      </div>
    {{ end }}
  </div>

  {{ with $.Params.releases.all }}
    <div class="text-center">
      <a href="{{ .href }}" class="button">{{ .text }}</a>
    </div>
  {{ end }}
{{ end }}
