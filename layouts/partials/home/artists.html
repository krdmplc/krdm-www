{{ with ($.Site.GetPage (printf "/%s" "artists")) }}
  <section>
    <h2 class="text-center">{{ $.Params.artists.title }}</h2>

    <div class="grid">
      {{ range first 4 .Pages }}
        <div class="col-12 col-sm-6">
          {{ partial "card" . }}
        </div>
      {{ end }}

      {{ with $.Params.artists.all }}
        <div class="col-12 text-center">
          <a href="{{ .href }}" class="button">{{ .text }}</a>
        </div>
      {{ end }}
    </div>
  </section>
{{ end }}
