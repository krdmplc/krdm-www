<a class="card" href="{{ .Permalink }}">
  <div class="card__image">
    <img src="{{ .Params.Thumbnail }}?nf_resize=fit&w=500" alt="">
  </div>
  <div class="card__text">
    <h3 class="no-margin">{{ .Title }}</h3>
    <div>{{ dateFormat "2. 1. 2006" .Params.startDate }}</div>
    <div>{{ .Params.venue }}</div>
  </div>
</a>
