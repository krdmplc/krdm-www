<nav class="breadcrumbs" aria-label="{{ T "breadcrumbs" }}">
  <ol class="breadcrumbs__list">
    {{- range .Ancestors.Reverse }}
      <li class="breadcrumbs__item"><a href="{{ .RelPermalink }}">{{ cond .IsHome site.Title .LinkTitle }}</a></li>
    {{- end }}
    <li class="breadcrumbs__item"><a href="{{ .RelPermalink }}" aria-current="page">{{ .LinkTitle }}</a></li>
  </ol>
</nav>
