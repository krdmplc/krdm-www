{{ $d := index .Site.Data.cookies }}
{{ $d = index $d .Site.Language.Lang }}

<div class="cookies is-hidden">
  <div class="container">
    <div class="grid">
      <div class="col-12 col-sm-8">
        <span>{{ $d.text | safeHTML }}</span>
      </div>

      <div class="col-12 col-sm-4 text-right">
        <button class="button cookies__confirm">{{ $d.confirm }}</button>
      </div>
    </div>
  </div>
</div>
