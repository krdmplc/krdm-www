{{ $d := index hugo.Data.footer site.Language.Lang }}

<footer class="footer">
  <div class="container footer__inner">
    <div>
      <p class="footer__title"><strong>{{ $d.title }}</strong></p>
      <address>
        {{ $d.address }}<br>
        {{ $d.vat }}
      </address>
    </div>
    <div>
      <a href="mailto:{{ $d.email }}">{{ $d.email }}</a><br>
      {{ with site.GetPage "/cookies" }}<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a><br>{{ end }}
      © 2016–{{ now.Year }} {{ $d.title }}
    </div>
    <div>
      {{ partial "social-menu" . }}
    </div>
  </div>
</footer>
