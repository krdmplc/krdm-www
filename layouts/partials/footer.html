{{ $d := index .Site.Data.footer }}
{{ $d = index $d .Site.Language.Lang }}

<footer class="footer">
  <div class="container">
    <div>
      <h4 class="no-margin">{{ $d.title }}</h4>
      {{ $d.address }}<br>
      {{ $d.vat }}
    </div>
    <div>
      <a href="mailto:{{ $d.email }}">{{ $d.email }}</a> <br>
      {{ $d.cookiesLink | safeHTML }}<br>
    </div>
    <div>
      {{ partial "social-menu" . }}
    </div>
  </div>
</footer>
