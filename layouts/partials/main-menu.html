{{ $current := . }}

<nav class="main-menu" aria-label="{{ T "mainMenu" }}">
  <button type="button" class="main-menu__toggle" aria-expanded="false" aria-controls="main-menu-items">
    <span class="main-menu__icon-open">{{ partial "icon" "menu" }}</span>
    <span class="main-menu__icon-close">{{ partial "icon" "x" }}</span>
    <span class="visually-hidden">{{ T "menu" }}</span>
  </button>

  <ul class="main-menu__items" id="main-menu-items">
    {{- range site.Menus.main }}
      <li>
        <a href="{{ .URL }}"
          {{- if $current.IsMenuCurrent "main" . }} aria-current="page"
          {{- else if $current.HasMenuCurrent "main" . }} aria-current="true"{{ end }}>
          {{- .Name -}}
        </a>
      </li>
    {{- end }}
  </ul>
</nav>
