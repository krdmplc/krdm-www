{{- /* Params: title, desc, image */ -}}
<div class="hero">
  {{ partial "image" (dict
    "src" (.image | default site.Params.heroImage)
    "alt" ""
    "class" "hero__image"
    "widths" (slice 800 1600)
    "eager" true
  ) }}
  <h1 class="hero__title">{{ .title }}</h1>
  {{ with .desc }}<p class="hero__subtitle">{{ . }}</p>{{ end }}
</div>
